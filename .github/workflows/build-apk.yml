name: Build ZenFocus APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q ZenFocus_Hybrid_Original_UI.zip -d .

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p zenfocus_hybrid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenFocus-APK
          path: zenfocus_hybrid/app/build/outputs/apk/debug/*.apk
