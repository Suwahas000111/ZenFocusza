name: Build ZenFocus APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZenFocus project
        run: unzip -q ZenFocus_Hybrid_Original_UI.zip -d .

      - name: Build APK
        run: gradle -p zenfocus_hybrid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenFocus-APK
          path: zenfocus_hybrid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
